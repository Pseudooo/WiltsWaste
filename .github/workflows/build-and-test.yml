name: Build & Test

on:
  pull_request:
    branches: [ "master" ]

jobs:
  build-migrations:
    name: Build Migrations Project
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27' # The Go version to download (if necessary) and use.

      - name: 📦 Install Dependencies
        working-directory: ./migrations
        run: go mod download

      - name: 🔨 Build
        working-directory: ./migrations
        run: go build .

  build-api:
    name: Build API Project
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27' # The Go version to download (if necessary) and use.

      - name: 📦 Install Dependencies
        working-directory: ./api
        run: go mod download

      - name: 🔨 Build
        working-directory: ./api
        run: go build .

      - name: 🧪 Test
        working-directory: ./api
        run: go test ./...

  build-web:
    name: Build Web Project
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: 📦 Install Dependencies
        working-directory: ./web
        run: npm i
      
      - name: Build
        working-directory: ./web
        run: npm run build
  