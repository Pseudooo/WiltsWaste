name: Publishn Container Images to GHCR
on:
  release:
    types: [published]

jobs:
  publish-migrations-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Publish Image
        uses: docker/build-push-action@v5
        with:
          context: ./migrations/
          push: true
          tags: ghcr.io/pseudooo/wiltswaste-migrations:${{ github.event.release.tag_name }}

  publish-api-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Publish Image
        uses: docker/build-push-action@v5
        with:
          context: ./api/
          push: true
          tags: ghcr.io/pseudooo/wiltswasteapi:${{ github.event.release.tag_name }}

  publish-web-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Publish Image
        uses: docker/build-push-action@v5
        with:
          build-args: |
            VITE_API_BASE_URL=https://api.wiltswaste.uk
          context: ./web/
          push: true
          tags: ghcr.io/pseudooo/wiltswasteweb:${{ github.event.release.tag_name }}