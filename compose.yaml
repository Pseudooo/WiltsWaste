name: WiltsWaste
services:
  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: http://localhost:25565
    ports:
      - 8080:8080

  api:
    build:
      context: ./api
    ports:
      - 25565:8080

  migrations:
    build:
      context: ./migrations
    environment:
      DB__HOSTNAME: database
      DB__DATABASE: postgres
      DB__USER: postgres
      DB__PASSWORD: postgres
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:18.6
    environment:
      - POSTGRES_PASSWORD=postgres
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5