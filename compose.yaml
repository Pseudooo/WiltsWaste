name: WiltsWaste
services:
  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: http://localhost:25565
    ports:
      - 8080:8080

  api:
    build:
      context: ./api
    ports:
      - 25565:8080

  database:
    image: postgres:18.6
    environment:
      - POSTGRES_PASSWORD=postgres
    networks:
      - server-side
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5